<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}稳定性试验文件登记{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">药</span>
        <span>药品稳定性试验 · 文件登记与撤销门禁</span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}">文件清单</a>
        <a href="{{ url_for('index') }}#upload">登记上传</a>
        <a href="{{ url_for('healthz') }}">健康检查</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with messages = messages if messages is defined else get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap footer">
    <p>登记内容不可修改；撤销不可逆。下载资格实时依据依赖链计算，不依赖定时清理。</p>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
